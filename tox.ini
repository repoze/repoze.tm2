[tox]
envlist = 
    py3.10,py3.11,py3.12,py3.13,py3.14,pypy3.11,
    cover,
    docs,
    lint

[testenv]
commands = 
    python -m pytest
usedevelop = true
deps =
    zope.interface
    transaction
    pytest
    pytest-cov
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:cover]
skip_install = true
basepython =
    python3.14
commands = 
    coverage combine
    coverage report --fail-under=100 --show-missing
deps =
    coverage[toml]
setenv =
    COVERAGE_FILE=.coverage

# we separate coverage into its own testenv because a) "last run wins" wrt
# cobertura jenkins reporting and b) pypy and jython can't handle any
# combination of versions of coverage and nosexcover that i can find.

[testenv:docs]
use_develop = true
basepython =
    python3.14
commands = 
    sphinx-build -na -b html -d {toxworkdir}/docs/_build/doctrees docs {toxworkdir}/docs/_build/html
deps =
    Sphinx
    transaction
    zope.interface

[testenv:lint]
skip_install = true
commands =
    ruff check
    ruff format --check
    check-manifest
    # build sdist/wheel
    python -m build .
    twine check dist/*
dependency_groups =
    dev
